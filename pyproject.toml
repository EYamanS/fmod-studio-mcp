[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmod-studio-mcp"
version = "0.1.0"
description = "MCP server that drives FMOD Studio live via its scripting terminal (TCP 3663) — full Scripting API access for AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Emir Yaman Sivrikaya" }]
keywords = ["fmod", "fmod-studio", "mcp", "model-context-protocol", "game-audio", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
# Both bounds are load-bearing.
#
# <2: mcp 2.x removed the Server.list_tools / Server.call_tool decorators this
# server is built on, so the server cannot even import.
#
# >=1.19: our call_tool returns a types.CallToolResult. Older versions do not
# recognise that type; they fall through to `list(results)` and build
# CallToolResult(content=...), which turns the pydantic model into a list of
# (field, value) tuples and fails validation on every single call. It also
# hardcodes isError=False there, losing the failure flag. The isinstance check
# that recognises CallToolResult first appears in 1.19.0.
dependencies = ["mcp>=1.19.0,<2"]

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/EYamanS/fmod-studio-mcp"
Issues = "https://github.com/EYamanS/fmod-studio-mcp/issues"

[project.scripts]
fmod-studio-mcp = "fmod_studio_mcp:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["fmod_studio_mcp*"]

[tool.setuptools.package-data]
fmod_studio_mcp = ["api_spec.json"]
